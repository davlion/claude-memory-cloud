<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Path: Gates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* A top-down flowchart: the main path runs down the middle, refusals and detours branch right, chat skips gate 2 on
   the left. Three colors only: ink, gray, and red for a save that stops. Arrows and their labels are always gray;
   color marks outcomes only. Scrolls sideways on narrow screens. */
:root {
  --bg: #f4f6f2; --fg: #1d2320; --muted: #57625b; --line: #9aa39c; --panel: #ffffff; --band: #e9ece7; --stop: #b8402f;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141916; --fg: #e5ebe5; --muted: #9ba69e; --line: #6f7b73; --panel: #1c231f; --band: #1a201c; --stop: #ec7d6b;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141916; --fg: #e5ebe5; --muted: #9ba69e; --line: #6f7b73; --panel: #1c231f; --band: #1a201c; --stop: #ec7d6b;
  color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); margin: 0; }
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 32px; }
header { display: grid; gap: 12px; max-width: 68ch; }
h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.lede { color: var(--muted); }
.lede a { color: inherit; }
.tag { font: 500 13px/1 var(--mono); color: var(--muted); letter-spacing: 0.02em; }

#gates { background: var(--panel); border: 1px solid var(--band); border-radius: 14px; padding: 16px; }
.scroll { overflow-x: auto; }
#gates svg { display: block; width: 100%; min-width: 900px; height: auto; }

.band { fill: var(--band); }
.edge { fill: none; stroke: var(--line); stroke-width: 2.5; }
.box { fill: var(--panel); stroke: var(--fg); stroke-width: 2; }
.box.dest { stroke-width: 3.5; }
.box.ask { stroke-dasharray: 7 5; }
.box.stop { stroke: var(--stop); }
.dia { fill: var(--panel); stroke: var(--fg); stroke-width: 2; }
.lbl { font: 600 14px var(--sans); fill: var(--muted); }

.fo { font: 15px/1.4 var(--sans); color: var(--fg); height: 100%; box-sizing: border-box; }
.fo.c { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.fo.v { display: flex; flex-direction: column; justify-content: center; }
.fo b { font-weight: 600; }
.fo .t { font-size: 18px; font-weight: 600; }
.fo .s { color: var(--muted); font-size: 14px; }
.fo code { font: 13.5px var(--mono); }
.fo.stop b { color: var(--stop); }
.fo.note { color: var(--muted); font-size: 14px; text-align: right; }
.fo ul { margin: 4px 0 0; padding-left: 18px; }
.fo li { margin: 2px 0; }
.gate { font: 15px/1.4 var(--sans); color: var(--fg); }
.gate .n { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  background: var(--fg); color: var(--panel); font-weight: 600; margin-bottom: 6px; }
.gate .t { display: block; font-size: 18px; font-weight: 600; line-height: 1.25; margin-bottom: 6px; }
.gate .s { display: block; color: var(--muted); font-size: 14px; }
.gate.row { display: flex; align-items: center; gap: 12px; }
.gate.row .n, .gate.row .t { margin: 0; }
</style>

<div class="wrap">
  <header>
    <span class="tag">claude-memory-cloud · the gates</span>
    <h1>Where a memory goes</h1>
    <p class="lede">A fact you tell Claude, in Claude Chat or Claude Code, the checks it meets, and the two places it can end up. See also <a href="memory-path-cartoon.html">the cartoon version</a>.</p>
  </header>

  <section id="gates">
    <div class="scroll">
      <svg viewBox="0 0 1200 1380" role="img" aria-label="Flowchart. You tell Claude a fact, in Claude Chat or Claude Code. Step 1, Claude's judgment: personal facts go to Claude's built-in memory in Claude Chat, and Claude Code tells you to add them there; passwords and keys are never saved; opinions about people and details about your computers are saved only after Claude asks you. Then the path splits in two. In Claude Chat, the fact goes straight to step 3. In Claude Code, step 2: every save needs an OK, and a save that isn't allowed stops on your computer; if Claude Code can't connect, the save waits on that computer and is sent the next time you start Claude Code. Step 3, the memory service's check: a small program between Claude and GitHub, with fixed rules Claude can't talk around. It refuses passwords and keys, personal facts and one client's details in another's memories, and holds opinions about people until you say yes. A save that passes becomes part of your memories on GitHub, shared by Claude Chat and Claude Code.">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>
        </defs>

        <!-- step bands; step 2 covers only the Claude Code lane, so chat visibly passes beside it -->
        <rect class="band" x="0" y="125" width="1200" height="430" rx="10"/>
        <rect class="band" x="470" y="640" width="730" height="200" rx="10"/>
        <rect class="band" x="0" y="1020" width="1200" height="190" rx="10"/>
        <foreignObject x="16" y="140" width="240" height="200"><div class="gate"><span class="n">1</span><span class="t">Claude's judgment</span><span class="s">Follows the memory rules you set up, but can be talked out of them.</span></div></foreignObject>
        <foreignObject x="662" y="650" width="520" height="40"><div class="gate row"><span class="n">2</span><span class="t">Claude Code asks permission</span><span class="s">Every save needs an OK.</span></div></foreignObject>
        <foreignObject x="16" y="1032" width="260" height="170"><div class="gate"><span class="n">3</span><span class="t">The memory service's check</span><span class="s">A small program between Claude and GitHub that files each memory. Its rules are fixed, so Claude can't talk it around.</span></div></foreignObject>

        <!-- step 1 spine -->
        <line class="edge" x1="520" y1="95" x2="520" y2="146" marker-end="url(#arr)"/>
        <line class="edge" x1="520" y1="250" x2="520" y2="278" marker-end="url(#arr)"/>
        <line class="edge" x1="520" y1="382" x2="520" y2="410" marker-end="url(#arr)"/>
        <line class="edge" x1="520" y1="514" x2="520" y2="566"/>

        <!-- start -->
        <rect class="box" x="330" y="15" width="380" height="80" rx="40"/>
        <foreignObject x="330" y="15" width="380" height="80"><div class="fo c"><span class="t">You tell Claude a fact</span><span class="s">in Claude Chat or Claude Code</span></div></foreignObject>

        <!-- step 1 -->
        <polygon class="dia" points="520,146 640,198 520,250 400,198"/>
        <foreignObject x="420" y="168" width="200" height="60"><div class="fo c"><b>Personal fact?</b></div></foreignObject>
        <line class="edge" x1="640" y1="198" x2="788" y2="198" marker-end="url(#arr)"/><text class="lbl" x="660" y="188">yes</text>
        <rect class="box dest" x="790" y="146" width="390" height="104" rx="12"/>
        <foreignObject x="806" y="146" width="362" height="104"><div class="fo v"><span class="t">Claude's built-in memory</span><span>Kept there in Claude Chat. Claude Code can't reach it, so it tells you to add it in Claude Chat.</span></div></foreignObject>

        <polygon class="dia" points="520,278 640,330 520,382 400,330"/>
        <foreignObject x="420" y="300" width="200" height="60"><div class="fo c"><b>Password or key?</b></div></foreignObject>
        <line class="edge" x1="640" y1="330" x2="788" y2="330" marker-end="url(#arr)"/><text class="lbl" x="660" y="320">yes</text>
        <rect class="box stop" x="790" y="294" width="390" height="72" rx="12"/>
        <foreignObject x="806" y="294" width="362" height="72"><div class="fo v stop"><b>Never saved</b></div></foreignObject>

        <polygon class="dia" points="520,410 640,462 520,514 400,462"/>
        <foreignObject x="440" y="426" width="160" height="72"><div class="fo c"><b>About someone, or your computers?</b></div></foreignObject>
        <line class="edge" x1="640" y1="462" x2="788" y2="462" marker-end="url(#arr)"/><text class="lbl" x="660" y="452">yes</text>
        <rect class="box ask" x="790" y="410" width="390" height="104" rx="12"/>
        <foreignObject x="806" y="410" width="362" height="104"><div class="fo v"><b>Claude asks you first</b><span>An opinion about someone: kept with your own notes, never a client's. Computer names and addresses: you choose where.</span></div></foreignObject>
        <path class="edge" d="M985 514 V540 H534" marker-end="url(#arr)"/><text class="lbl" x="860" y="532">on your yes</text>
        <text class="lbl" x="532" y="276">no</text><text class="lbl" x="532" y="408">no</text><text class="lbl" x="508" y="532" text-anchor="end">no: it's about work</text>

        <!-- the split: chat drops straight to step 3, Claude Code goes through step 2 and may wait -->
        <path class="edge" d="M520 565 L400 625 V1000 L520 1052"/>
        <path class="edge" d="M520 565 L640 625 V698" marker-end="url(#arr)"/>
        <text class="lbl" x="448" y="590" text-anchor="end">Claude Chat</text>
        <text class="lbl" x="592" y="590">Claude Code</text>
        <foreignObject x="130" y="760" width="256" height="80"><div class="fo note">Claude Chat has no permission step, and nothing waits on a computer.</div></foreignObject>

        <!-- step 2 -->
        <polygon class="dia" points="640,700 740,752 640,804 540,752"/>
        <foreignObject x="550" y="722" width="180" height="60"><div class="fo c"><b>Allowed?</b></div></foreignObject>
        <line class="edge" x1="740" y1="752" x2="848" y2="752" marker-end="url(#arr)"/><text class="lbl" x="752" y="742">no</text>
        <rect class="box stop" x="850" y="706" width="330" height="92" rx="12"/>
        <foreignObject x="866" y="706" width="302" height="92"><div class="fo v stop"><b>Stopped on your computer</b><span>Your settings decide, then you, or in auto mode Claude Code's safety reviewer.</span></div></foreignObject>
        <line class="edge" x1="640" y1="804" x2="640" y2="876" marker-end="url(#arr)"/><text class="lbl" x="652" y="860">yes</text>

        <!-- waiting on the computer -->
        <polygon class="dia" points="640,878 740,930 640,982 540,930"/>
        <foreignObject x="550" y="900" width="180" height="60"><div class="fo c"><b>Try to save</b></div></foreignObject>
        <line class="edge" x1="740" y1="930" x2="848" y2="930" marker-end="url(#arr)"/><text class="lbl" x="752" y="920">can't connect</text>
        <rect class="box ask" x="850" y="878" width="330" height="104" rx="12"/>
        <foreignObject x="866" y="878" width="302" height="104"><div class="fo v"><b>Waits on that computer</b><span>Sent the next time you start Claude Code.</span></div></foreignObject>
        <path class="edge" d="M1015 982 V1000 H654" marker-end="url(#arr)"/><text class="lbl" x="900" y="996">sent later</text>
        <path class="edge" d="M640 982 V1000 L520 1052"/><text class="lbl" x="628" y="998" text-anchor="end">connected</text>
        <line class="edge" x1="520" y1="1052" x2="520" y2="1070" marker-end="url(#arr)"/>

        <!-- step 3 -->
        <polygon class="dia" points="520,1072 640,1124 520,1176 400,1124"/>
        <foreignObject x="420" y="1094" width="200" height="60"><div class="fo c"><b>Does it pass?</b></div></foreignObject>
        <line class="edge" x1="640" y1="1124" x2="788" y2="1124" marker-end="url(#arr)"/><text class="lbl" x="660" y="1114">no</text>
        <rect class="box stop" x="790" y="1044" width="390" height="152" rx="12"/>
        <foreignObject x="806" y="1044" width="362" height="152"><div class="fo v stop"><b>Not saved</b><ul>
          <li>A password or key</li>
          <li>A personal fact</li>
          <li>One client's details in another client's memories</li>
          <li>An opinion about someone, until you say yes</li>
        </ul></div></foreignObject>
        <line class="edge" x1="520" y1="1176" x2="520" y2="1248" marker-end="url(#arr)"/><text class="lbl" x="532" y="1232">yes</text>

        <!-- destination -->
        <rect class="box dest" x="330" y="1250" width="380" height="110" rx="12"/>
        <foreignObject x="350" y="1250" width="340" height="110"><div class="fo c"><span class="t">Your memories on GitHub</span><span>Shared by Claude Chat and Claude Code.</span></div></foreignObject>
      </svg>
    </div>
  </section>
</div>
</html>
