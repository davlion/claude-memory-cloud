# Runs every offline test suite on each push to main and on pull requests. Nothing here talks to Cloudflare, GitHub's
# API or a memory server: the Worker tests run in workerd with GitHub mocked, and the kit and e2e unit tests use
# temporary homes and scripted transcripts. Actions are pinned to commits so a moved tag can't change what runs.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    name: Worker (vitest + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  kit:
    name: Kit and e2e units (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }   # the oldest Python the kit supports
          - { os: ubuntu-latest, python: "3.x" }
          - { os: macos-latest, python: "3.x" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s test/local
      - run: python3 -m unittest discover -s test/e2e

  crypt:
    name: Kit encryption (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]   # 3.9 is the oldest Python the kit supports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: "python3 -m pip install --require-hashes --only-binary :all: -r kit/requirements-crypt.txt"
      - run: python3 -m unittest discover -s test/local -p 'test_*crypt*.py'
